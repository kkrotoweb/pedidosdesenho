
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canal de Desenhos - Consulta Pública</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    colors: {
                        brand: {
                            50: '#f5f3ff', 100: '#ede9fe', 500: '#8b5cf6', 600: '#7c3aed', 900: '#4c1d95',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #f8fafc; color: #0f172a; }
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #f1f5f9; }
        ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
        .fade-in { animation: fadeIn 0.3s ease-in-out; }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .truncate-2-lines {
            display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col font-sans">
    <header class="bg-gradient-to-r from-brand-900 via-brand-600 to-brand-500 text-white shadow-lg sticky top-0 z-40">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
            <div class="flex flex-col md:flex-row justify-between items-center gap-4">
                <div class="flex items-center gap-3">
                    <div class="bg-white/20 p-3 rounded-xl backdrop-blur-sm">
                        <i class="fa-solid fa-tv text-2xl"></i>
                    </div>
                    <div>
                        <h1 class="text-2xl font-bold tracking-tight">Canal de Desenhos</h1>
                        <p class="text-brand-100 text-sm">Consulta de Pedidos</p>
                    </div>
                </div>
                <div class="flex gap-4 text-sm font-medium">
                    <div class="bg-white/10 px-4 py-2 rounded-lg flex flex-col items-center">
                        <span class="text-brand-100 text-xs uppercase tracking-wider">Fila</span>
                        <span class="text-xl font-bold" id="count-fila">0</span>
                    </div>
                    <div class="bg-white/10 px-4 py-2 rounded-lg flex flex-col items-center">
                        <span class="text-brand-100 text-xs uppercase tracking-wider">Não Encontrados</span>
                        <span class="text-xl font-bold" id="count-not-found">0</span>
                    </div>
                    <div class="bg-white/20 px-4 py-2 rounded-lg flex flex-col items-center border border-white/20">
                        <span class="text-brand-100 text-xs uppercase tracking-wider">Total</span>
                        <span class="text-xl font-bold" id="count-total">0</span>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full">
        <div class="flex flex-col md:flex-row gap-4 justify-between items-center mb-8 bg-white p-4 rounded-2xl shadow-sm border border-slate-100">
            <div class="relative w-full md:w-1/2 lg:w-1/3">
                <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                    <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                </div>
                <input type="text" id="input-busca" placeholder="🔎 Procurar pedido, pessoa..." 
                    class="block w-full pl-10 pr-3 py-3 border border-slate-200 rounded-xl leading-5 bg-slate-50 placeholder-slate-400 focus:outline-none focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm">
            </div>
            
            <div class="w-full md:w-auto flex items-center gap-2">
                <span class="text-sm text-slate-500 font-medium hidden md:inline-block"><i class="fa-solid fa-arrow-down-a-z"></i> Ordenar:</span>
                <select id="select-ordenacao" onchange="mudarOrdenacao(this.value)" class="block w-full md:w-auto px-4 py-3 border border-slate-200 rounded-xl leading-5 bg-slate-50 text-slate-700 focus:outline-none focus:bg-white focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all text-sm font-medium cursor-pointer">
                    <option value="az">Alfabética (A-Z)</option>
                    <option value="za">Alfabética (Z-A)</option>
                    <option value="recentes">Mais Recentes</option>
                    <option value="antigos">Mais Antigos</option>
                </select>
            </div>
        </div>

        <div class="flex space-x-1 bg-slate-200/50 p-1 rounded-xl mb-6 w-full max-w-sm mx-auto md:mx-0">
            <button id="tab-pending" onclick="mudarAba('pending')" class="w-full py-2.5 text-sm font-medium rounded-lg transition-all text-brand-600 bg-white shadow">
                <i class="fa-solid fa-list mr-2"></i>Pedidos
            </button>
            <button id="tab-not_found" onclick="mudarAba('not_found')" class="w-full py-2.5 text-sm font-medium rounded-lg transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50">
                <i class="fa-solid fa-ghost mr-2"></i>Não Encontrados
            </button>
        </div>

        <div id="grid-pedidos" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 xl:grid-cols-4 gap-6"></div>

        <div id="estado-vazio" class="hidden flex flex-col items-center justify-center py-20 text-center fade-in">
            <div class="bg-slate-100 p-6 rounded-full mb-4">
                <i class="fa-solid fa-box-open text-4xl text-slate-400"></i>
            </div>
            <h3 class="text-lg font-medium text-slate-900 mb-1">Nenhum pedido encontrado</h3>
            <p class="text-slate-500 max-w-sm">Tente pesquisar por outro termo.</p>
        </div>
    </main>

    <div id="modal-detalhes" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4" onclick="if(event.target === this) fecharModalDetalhes()">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-2xl max-h-[95vh] flex flex-col overflow-hidden transform scale-95 opacity-0 transition-all duration-300 relative" id="modal-detalhes-content">
            <button onclick="fecharModalDetalhes()" class="absolute top-4 right-4 z-10 bg-black/50 hover:bg-black/80 text-white w-8 h-8 rounded-full flex items-center justify-center transition-colors backdrop-blur-md border border-white/20">
                <i class="fa-solid fa-xmark"></i>
            </button>
            <div class="overflow-y-auto flex-grow flex flex-col md:flex-row">
                <div class="md:w-5/12 h-64 md:h-auto bg-slate-900 relative flex-shrink-0">
                    <img id="detalhe-imagem" src="" alt="Capa do Desenho" class="w-full h-full object-cover">
                </div>
                <div class="p-6 md:w-7/12 flex flex-col bg-white">
                    <h2 id="detalhe-titulo" class="text-2xl font-bold text-slate-800 mb-1 leading-tight"></h2>
                    <p id="detalhe-ano" class="text-brand-600 font-bold mb-6 text-sm bg-brand-50 inline-block px-3 py-1 rounded-full w-max"></p>
                    <div class="space-y-4 text-sm text-slate-600 mb-6 flex-grow">
                        <div class="flex items-start gap-3">
                            <div class="bg-slate-100 p-2 rounded-lg text-slate-500"><i class="fa-solid fa-user w-4 text-center"></i></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">Pedido por</p>
                                <p id="detalhe-pessoa" class="font-medium text-slate-700 text-base"></p>
                            </div>
                        </div>
                        <div class="flex items-start gap-3">
                            <div class="bg-slate-100 p-2 rounded-lg text-slate-500"><i class="fa-solid fa-calendar-day w-4 text-center"></i></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">Data do pedido</p>
                                <p id="detalhe-data" class="font-medium text-slate-700"></p>
                            </div>
                        </div>
                        <div class="flex items-start gap-3">
                            <div class="bg-slate-100 p-2 rounded-lg text-slate-500"><i class="fa-solid fa-clock w-4 text-center"></i></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">Tempo na fila</p>
                                <p id="detalhe-tempo" class="font-medium text-slate-700"></p>
                            </div>
                        </div>
                        <div class="flex items-start gap-3">
                            <div class="bg-slate-100 p-2 rounded-lg text-slate-500"><i class="fa-solid fa-circle-info w-4 text-center"></i></div>
                            <div>
                                <p class="text-xs text-slate-400 font-medium uppercase tracking-wide">Status</p>
                                <p id="detalhe-status" class="font-medium text-slate-700"></p>
                            </div>
                        </div>
                    </div>
                    <div id="detalhe-comentarios-container" class="mt-2 pt-5 border-t border-slate-100 hidden">
                        <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3"><i class="fa-regular fa-comment-dots mr-1"></i> Comentários</h3>
                        <div id="detalhe-comentarios" class="whitespace-pre-wrap text-slate-700 text-sm bg-slate-50 p-4 rounded-xl border border-slate-100 leading-relaxed italic"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CONFIG = {
            SIMILARIDADE_MINIMA: 0.45, 
            IMAGEM_PADRAO: "https://placehold.co/400x600/e2e8f0/64748b?text=Sem+Capa"
        };
        const DADOS_INICIAIS = [{"id":"msqtulw0ggu7dy836tl","titulo":"Bubble Guppies","solicitadoPor":"Kaname Demon","dataPedido":"2026-08-13","anoLancamento":"2011","comentarios":"","imagem":"https://imgs.search.brave.com/3TcINo26VtvsYjKM8HBhGJG9fIfstKUoD_d47WrK_fc/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9tLm1l/ZGlhLWFtYXpvbi5j/b20vaW1hZ2VzL00v/TVY1Qk5XVmtNMkV3/TkdNdE9XUm1OaTAw/WTJJeExUaGxORE10/WldFNE4yWXlZbUZp/TURrelhrRXlYa0Zx/Y0djQC5qcGc","status":"pending"},{"id":"msqtwfg2z66m7tw41oa","titulo":"Unigata","solicitadoPor":"Kaname Demon","dataPedido":"2026-08-13","anoLancamento":"2017","comentarios":"","imagem":"https://imgs.search.brave.com/dkNmMol9syBb4Fn5gsTb33Gl3yPFEswrhyYLEZMCaco/rs:fit:860:0:0:0/g:ce/aHR0cHM6Ly9zdGF0/aWMud2lraWEubm9j/b29raWUubmV0L2R1/YmxhZ2VtL2ltYWdl/cy9hL2EwL1VuaWdh/dGFfcG9zdGVyLmpw/ZWcvcmV2aXNpb24v/bGF0ZXN0L3NjYWxl/LXRvLXdpZHRoLWRv/d24vMjY3P2NiPTIw/MjQxMTI4MjE0NjA2/JnBhdGgtcHJlZml4/PXB0LWJy","status":"pending"}];
        let pedidos = DADOS_INICIAIS; 
        let abaAtual = 'pending'; 
        let termoBusca = ''; 
        let debounceTimer; 
        let ordenacaoAtual = 'az';

        document.addEventListener('keydown', function(event) {
            if (event.key === "Escape") fecharModalDetalhes();
        });

        window.onload = function() {
            configurarEventosBusca();
            renderizarInterface();
        };

        function mudarAba(aba) {
            abaAtual = aba;
            const btnPending = document.getElementById('tab-pending');
            const btnNotFound = document.getElementById('tab-not_found');
            if (aba === 'pending') {
                btnPending.className = "w-full py-2.5 text-sm font-medium rounded-lg transition-all text-brand-600 bg-white shadow";
                btnNotFound.className = "w-full py-2.5 text-sm font-medium rounded-lg transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50";
            } else {
                btnNotFound.className = "w-full py-2.5 text-sm font-medium rounded-lg transition-all text-brand-600 bg-white shadow";
                btnPending.className = "w-full py-2.5 text-sm font-medium rounded-lg transition-all text-slate-500 hover:text-slate-700 hover:bg-slate-200/50";
            }
            renderizarInterface();
        }

        function mudarOrdenacao(valor) {
            ordenacaoAtual = valor;
            renderizarInterface();
        }

        function atualizarContadores() {
            document.getElementById('count-fila').innerText = pedidos.filter(p => p.status === 'pending').length;
            document.getElementById('count-not-found').innerText = pedidos.filter(p => p.status === 'not_found').length;
            document.getElementById('count-total').innerText = pedidos.length;
        }

        function renderizarInterface() {
            const container = document.getElementById('grid-pedidos');
            const estadoVazio = document.getElementById('estado-vazio');
            
            let pedidosFiltrados = pedidos.filter(p => p.status === abaAtual);

            if (termoBusca.trim() !== '') {
                pedidosFiltrados = executarPesquisaInteligente(pedidosFiltrados, termoBusca);
            }

            pedidosFiltrados.sort((a, b) => {
                if (ordenacaoAtual === 'az') return a.titulo.localeCompare(b.titulo);
                if (ordenacaoAtual === 'za') return b.titulo.localeCompare(a.titulo);
                if (ordenacaoAtual === 'recentes') return new Date(b.dataPedido) - new Date(a.dataPedido);
                if (ordenacaoAtual === 'antigos') return new Date(a.dataPedido) - new Date(b.dataPedido);
                return 0;
            });

            container.innerHTML = '';
            
            if (pedidosFiltrados.length === 0) {
                container.classList.add('hidden');
                estadoVazio.classList.remove('hidden');
            } else {
                container.classList.remove('hidden');
                estadoVazio.classList.add('hidden');
                pedidosFiltrados.forEach(pedido => {
                    container.innerHTML += criarHTMLCard(pedido);
                });
            }
            atualizarContadores();
        }

        function criarHTMLCard(pedido) {
            const infoTempo = calcularTempoFila(pedido.dataPedido);
            let corTempo = "text-slate-500 bg-slate-100";
            if (infoTempo.dias >= 30) corTempo = "text-red-700 bg-red-100 border border-red-200";
            else if (infoTempo.dias >= 7) corTempo = "text-amber-700 bg-amber-100 border border-amber-200";
            else corTempo = "text-emerald-700 bg-emerald-100 border border-emerald-200";

            const imagemUrl = pedido.imagem ? pedido.imagem : CONFIG.IMAGEM_PADRAO;
            const displayAno = pedido.anoLancamento ? `<span class="bg-slate-100 text-slate-600 px-2 py-0.5 rounded text-xs ml-2">${pedido.anoLancamento}</span>` : "";

            return `
                <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden hover:shadow-md transition-all fade-in flex flex-col h-full group cursor-pointer hover:border-brand-300" onclick="abrirModalDetalhes('${pedido.id}')">
                    <div class="h-48 w-full relative overflow-hidden bg-slate-100">
                        <img src="${imagemUrl}" alt="Capa de ${pedido.titulo}" onerror="this.onerror=null; this.src='${CONFIG.IMAGEM_PADRAO}';" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500">
                        <div class="absolute top-3 right-3 px-2.5 py-1 rounded-md text-xs font-bold shadow-sm backdrop-blur-md ${corTempo}" title="Pedido feito em: ${formatarDataBR(pedido.dataPedido)}">
                            <i class="fa-regular fa-clock mr-1"></i> ${infoTempo.texto}
                        </div>
                    </div>
                    <div class="p-5 flex-grow flex flex-col">
                        <h3 class="text-lg font-bold text-slate-800 mb-1 truncate-2-lines leading-tight" title="${pedido.titulo}">${pedido.titulo}${displayAno}</h3>
                        <p class="text-sm text-slate-500 mb-2 flex items-center gap-1.5 mt-auto pt-2">
                            <i class="fa-regular fa-user text-slate-400"></i>
                            <span class="truncate">Por: <span class="font-medium text-slate-700">${pedido.solicitadoPor}</span></span>
                        </p>
                        <div class="text-center mt-3 pt-4 border-t border-slate-100">
                            <span class="text-[10px] font-bold uppercase tracking-wider text-slate-400 group-hover:text-brand-500 transition-colors">Clique para ver detalhes</span>
                        </div>
                    </div>
                </div>
            `;
        }

        function formatarDataBR(dataIso) {
            if(!dataIso) return "";
            const [ano, mes, dia] = dataIso.split('-');
            return `${dia}/${mes}/${ano}`;
        }

        function calcularTempoFila(dataIso) {
            const dataPedido = new Date(dataIso + 'T00:00:00'); 
            const hoje = new Date();
            hoje.setHours(0,0,0,0);
            const diferencaMilissegundos = hoje - dataPedido;
            const diferencaDias = Math.floor(diferencaMilissegundos / (1000 * 60 * 60 * 24));
            if (diferencaDias === 0) return { dias: 0, texto: "Hoje" };
            if (diferencaDias === 1) return { dias: 1, texto: "Ontem" };
            if (diferencaDias < 7) return { dias: diferencaDias, texto: `${diferencaDias} dias` };
            const semanas = Math.floor(diferencaDias / 7);
            if (semanas === 1) return { dias: diferencaDias, texto: "1 semana" };
            if (semanas < 4) return { dias: diferencaDias, texto: `${semanas} semanas` };
            const meses = Math.floor(diferencaDias / 30);
            if (meses === 1) return { dias: diferencaDias, texto: "1 mês" };
            return { dias: diferencaDias, texto: `${meses} meses` };
        }

        function abrirModalDetalhes(id) {
            const pedido = pedidos.find(p => p.id === id);
            if (!pedido) return;
            document.getElementById('detalhe-imagem').src = pedido.imagem || CONFIG.IMAGEM_PADRAO;
            document.getElementById('detalhe-titulo').innerText = pedido.titulo;
            document.getElementById('detalhe-pessoa').innerText = pedido.solicitadoPor;
            document.getElementById('detalhe-data').innerText = formatarDataBR(pedido.dataPedido);
            document.getElementById('detalhe-ano').innerText = pedido.anoLancamento ? `Ano: ${pedido.anoLancamento}` : "Ano de lançamento não informado";
            
            const infoTempo = calcularTempoFila(pedido.dataPedido);
            document.getElementById('detalhe-tempo').innerText = infoTempo.texto;
            
            const txtStatus = pedido.status === 'pending' ? 'Na fila' : 'Não encontrado';
            const elStatus = document.getElementById('detalhe-status');
            elStatus.innerText = txtStatus;
            elStatus.className = pedido.status === 'pending' 
                ? "font-medium text-brand-600 bg-brand-50 px-2 py-0.5 rounded" 
                : "font-medium text-slate-500 bg-slate-100 px-2 py-0.5 rounded";

            const containerComentarios = document.getElementById('detalhe-comentarios-container');
            const textoComentarios = document.getElementById('detalhe-comentarios');

            if (pedido.comentarios && pedido.comentarios.trim() !== '') {
                textoComentarios.textContent = pedido.comentarios; 
                containerComentarios.classList.remove('hidden');
            } else {
                containerComentarios.classList.add('hidden');
                textoComentarios.textContent = "";
            }

            const modal = document.getElementById('modal-detalhes');
            const content = document.getElementById('modal-detalhes-content');
            modal.classList.remove('hidden');
            setTimeout(() => {
                content.classList.remove('scale-95', 'opacity-0');
                content.classList.add('scale-100', 'opacity-100');
            }, 10);
        }

        function fecharModalDetalhes() {
            const modal = document.getElementById('modal-detalhes');
            const content = document.getElementById('modal-detalhes-content');
            content.classList.remove('scale-100', 'opacity-100');
            content.classList.add('scale-95', 'opacity-0');
            setTimeout(() => { modal.classList.add('hidden'); }, 300);
        }

        function configurarEventosBusca() {
            const inputBusca = document.getElementById('input-busca');
            inputBusca.addEventListener('input', (e) => {
                clearTimeout(debounceTimer);
                debounceTimer = setTimeout(() => {
                    termoBusca = e.target.value;
                    renderizarInterface();
                }, 300);
            });
        }

        function normalizarTexto(texto) {
            if (!texto) return "";
            return texto.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9\s]/g, "").replace(/\s+/g, " ").trim();
        }

        function calcularLevenshtein(a, b) {
            if (a.length === 0) return b.length;
            if (b.length === 0) return a.length;
            const matriz = [];
            for (let i = 0; i <= b.length; i++) matriz[i] = [i];
            for (let j = 0; j <= a.length; j++) matriz[0][j] = j;
            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matriz[i][j] = matriz[i - 1][j - 1];
                    } else {
                        matriz[i][j] = Math.min(matriz[i - 1][j - 1] + 1, Math.min(matriz[i][j - 1] + 1, matriz[i - 1][j] + 1));
                    }
                }
            }
            return matriz[b.length][a.length];
        }

        function calcularSimilaridade(str1, str2) {
            const tamanhoMaximo = Math.max(str1.length, str2.length);
            if (tamanhoMaximo === 0) return 1.0;
            return (tamanhoMaximo - calcularLevenshtein(str1, str2)) / tamanhoMaximo;
        }

        function executarPesquisaInteligente(lista, termo) {
            const termoNorm = normalizarTexto(termo);
            if (termoNorm === '') return lista;
            const palavrasBusca = termoNorm.split(' ');
            const resultados = lista.map(pedido => {
                const tituloNorm = normalizarTexto(pedido.titulo);
                const pessoaNorm = normalizarTexto(pedido.solicitadoPor);
                const anoNorm = pedido.anoLancamento ? normalizarTexto(pedido.anoLancamento.toString()) : "";
                let notaFinal = 0;
                if (tituloNorm.includes(termoNorm) || pessoaNorm.includes(termoNorm) || anoNorm === termoNorm) {
                    notaFinal = 1.0; 
                } else {
                    let palavrasEncontradas = 0;
                    for(let palavra of palavrasBusca) {
                        if (tituloNorm.includes(palavra) || pessoaNorm.includes(palavra) || anoNorm === palavra) palavrasEncontradas++;
                    }
                    if (palavrasEncontradas === palavrasBusca.length) {
                        notaFinal = 0.9; 
                    } else {
                        const similaridadeTitulo = calcularSimilaridade(termoNorm, tituloNorm);
                        let maxSim = 0;
                        for (let pBusca of palavrasBusca) {
                            for (let pTit of tituloNorm.split(' ')) {
                                const sim = calcularSimilaridade(pBusca, pTit);
                                if (sim > maxSim) maxSim = sim;
                            }
                        }
                        notaFinal = Math.max(similaridadeTitulo, maxSim - 0.1); 
                    }
                }
                return { pedido, nota: notaFinal };
            });
            const filtrados = resultados.filter(item => item.nota >= CONFIG.SIMILARIDADE_MINIMA);
            filtrados.sort((a, b) => {
                if (b.nota !== a.nota) return b.nota - a.nota;
                return a.pedido.titulo.localeCompare(b.pedido.titulo);
            });
            return filtrados.map(item => item.pedido);
        }
    </script>
</body>
